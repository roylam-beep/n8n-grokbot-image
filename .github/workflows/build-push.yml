name: Build and push n8n-grokbot image
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/n8n-grokbot:2.40.1-admin
            ghcr.io/${{ github.repository_owner }}/n8n-grokbot:2.40.1-admin-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/n8n-grokbot:latest
